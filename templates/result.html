<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encryption Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #495057 0%, #343a40 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-wrapper {
            width: 100%;
            max-width: 600px;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border: none;
        }

        .card-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-body {
            padding: 40px 30px;
        }

        .hash-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #6c757d;
        }

        .hash-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hash-value {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
            color: #333;
            font-weight: 500;
        }

        .decrypt-section h3 {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #6c757d;
            box-shadow: 0 0 0 3px rgba(108, 117, 125, 0.1);
        }

        .btn-decrypt {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-decrypt:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(108, 117, 125, 0.4);
            color: white;
        }

        .btn-back {
            background: #f8f9fa;
            border: 2px solid #6c757d;
            border-radius: 10px;
            color: #6c757d;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 10px 24px;
        }

        .btn-back:hover {
            background: #6c757d;
            color: white;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div class="container-wrapper">
        <div class="card">
            <div class="card-header">
                <h2>
                    <i class="bi bi-check-circle"></i>
                    Encryption Successful
                </h2>
            </div>
            <div class="card-body">
                <div class="hash-section">
                    <div class="hash-label">
                        <i class="bi bi-fingerprint"></i>
                        SHA-256 Integrity Hash
                    </div>
                    <div class="hash-value">{{ hash_value }}</div>
                    <small class="text-muted d-block mt-2">Save this hash to verify file integrity later</small>
                </div>

                <div class="decrypt-section">
                    <h3>
                        <i class="bi bi-unlock"></i>
                        Decrypt File
                    </h3>
                    <form action="/decrypt" method="post">
                        <input type="hidden" name="encrypted_file" value="{{ encrypted_file }}">

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="bi bi-key"></i>
                                Enter Password
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Enter your encryption password" required>
                        </div>

                        <button type="submit" class="btn btn-decrypt">
                            <i class="bi bi-unlock-fill"></i>
                            Decrypt File
                        </button>
                    </form>
                </div>

                <div class="button-group">
                    <a href="/" class="btn btn-back">
                        <i class="bi bi-house"></i>
                        Back Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
