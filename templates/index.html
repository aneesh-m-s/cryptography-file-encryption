<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Encryption System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        body {
            background: linear-gradient(135deg, #495057 0%, #343a40 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-wrapper {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background: var(--primary-gradient);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 30px 20px;
            text-align: center;
            border: none;
        }

        .card-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-body {
            padding: 40px 30px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #6c757d;
            box-shadow: 0 0 0 3px rgba(108, 117, 125, 0.1);
            background-color: #fff;
        }

        .btn-encrypt {
            background: var(--primary-gradient);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-encrypt:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(108, 117, 125, 0.4);
            color: white;
        }

        .btn-encrypt:active {
            transform: translateY(0);
        }

        .input-group-text {
            background-color: #f8f9ff;
            border: 2px solid #e0e0e0;
            color: #6c757d;
        }

        .form-control.form-control-file {
            padding: 8px;
        }
    </style>
</head>

<body>
    <div class="container-wrapper">
        <div class="card">
            <div class="card-header">
                <h2>
                    <i class="bi bi-shield-lock"></i>
                    File Encryption
                </h2>
            </div>
            <div class="card-body">
                <form action="/encrypt" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">
                            <i class="bi bi-file-earmark"></i>
                            Select File
                        </label>
                        <input type="file" class="form-control" id="file" name="file" required>
                        <small class="text-muted">Choose any file to encrypt</small>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-key"></i>
                            Encryption Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter a strong password" required>
                        <small class="text-muted">You'll need this to decrypt later</small>
                    </div>

                    <button type="submit" class="btn btn-encrypt">
                        <i class="bi bi-lock-fill"></i>
                        Encrypt & Generate Hash
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
